[project]
name = "ecclesia-flow-api"
version = "0.1.0"
description = "EcclesiaFlow backend — multi-tenant Church Management SaaS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prisma>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "qrcode[pil]>=8.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "email-validator>=2.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's DI system is built on `Depends(...)` as an argument
# default — flake8-bugbear's own docs list this as the standard exception.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Without this, ruff's first-party auto-detection gets confused by the
# `prisma/` directory at the project root (schema.prisma, migrations/ — not
# a Python package) and treats the installed `prisma` pip package
# inconsistently depending on which submodule is imported.
known-third-party = ["prisma"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped so every test reuses the one event loop the Prisma clients
# (module-level singletons in app.core.database, connected once in
# tests/conftest.py) were connected on — a fresh per-test loop (pytest-
# asyncio's default) breaks the second test to run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
