services:
  postgres:
    image: postgres:17-alpine
    container_name: ecclesia-flow-postgres
    environment:
      POSTGRES_DB: ecclesia_flow
      POSTGRES_USER: ecclesia_admin
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "55433:5432"
    volumes:
      - ecclesia_flow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecclesia_admin -d ecclesia_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecclesia_flow_pgdata:
